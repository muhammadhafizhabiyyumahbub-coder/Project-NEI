[project]
name = "nei"
version = "0.1.0"
description = "NEI — Nautical Engineering Intelligence: local-first AI engineering assistant"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.24",
    "numpy>=1.24",
    "scipy>=1.10",
    "pint>=0.20",
    "aiosqlite>=0.19",
    "python-dotenv>=1.0",
    "sse-starlette>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nei*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = false

